on:
  push:
    branches: [ master_integration ]   # was: main
    paths-ignore:                      # doc-only changes don't need a prod redeploy
      - '**.md'

permissions: { id-token: write, contents: read }   # OIDC
jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: '10.0.x' }

      - run: dotnet restore
      - run: dotnet build -c Release --no-restore

      # ── EF migrations ────────────────────────────────────────────────────────
      # Generate an IDEMPOTENT migration script from the committed migrations and apply it to
      # Azure SQL BEFORE the new app version is swapped in. Migrations are NOT applied at app
      # startup (MigrateAsync was removed to avoid cold-start/multi-instance races), so this step
      # is the ONLY place the schema is updated. Previously this was an empty comment, which left
      # prod's schema frozen — do not remove it.
      - name: Install EF Core tools
        run: dotnet tool install --global dotnet-ef --version 10.0.9

      - name: Generate idempotent migration script
        run: |
          export PATH="$PATH:$HOME/.dotnet/tools"
          dotnet ef migrations script --idempotent \
            --project Edvanz.Infrastructure --startup-project Edvanz.API \
            -o migrate.sql
          echo "---- migrate.sql (head) ----"; head -n 40 migrate.sql

      # SELF-CONTAINED publish (bundles .NET 10 runtime — immune to platform rollout)
      - run: dotnet publish Edvanz.API -c Release -r linux-x64 --self-contained true -o ./publish

      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # Inject the DB connection string into Azure App Service configuration from the secret, so it
      # is NEVER committed to the repo (appsettings.Production.json intentionally has no "con").
      # Runs BEFORE deploy and fail-fast: if it errors, the job stops and the running app is left
      # untouched. Only writes when the value actually changed: an unconditional write restarts the
      # site on EVERY deploy, and that extra restart raced the OneDeploy restart — first containers
      # sometimes booted without the app setting, fell back to the committed (rotated) connection
      # string, crashed with SQL login error 18456, and Azure retried the container (the "slow
      # deploys" of 2026-07-10..12; see /home/LogFiles/StartupLogs/*_failure.log).
      - name: Set DB connection string in App Service config
        env:
          PROD_SQL_CONNECTION: ${{ secrets.PROD_SQL_CONNECTION }}
        run: |
          RG=$(az webapp list --query "[?name=='app-edvanz-api-prod'].resourceGroup | [0]" -o tsv)
          if [ -z "$RG" ]; then echo "Could not resolve resource group for app-edvanz-api-prod"; exit 1; fi
          echo "Resource group: $RG"
          echo "RG=$RG" >> "$GITHUB_ENV"
          CURRENT=$(az webapp config appsettings list \
            --name app-edvanz-api-prod --resource-group "$RG" \
            --query "[?name=='ConnectionStrings__con'].value | [0]" -o tsv)
          if [ "$CURRENT" = "$PROD_SQL_CONNECTION" ]; then
            echo "App setting ConnectionStrings__con already up to date — skipping write (avoids a site restart)."
          else
            az webapp config appsettings set \
              --name app-edvanz-api-prod --resource-group "$RG" \
              --settings "ConnectionStrings__con=$PROD_SQL_CONNECTION" \
              --output none
            echo "App setting ConnectionStrings__con updated."
          fi

      # Apply the migration script to Azure SQL. azure/sql-action opens a temporary firewall rule
      # for the runner using the azure/login session above and removes it afterwards.
      # Requires repo secret PROD_SQL_CONNECTION (an ADO.NET connection string to the prod DB).
      # The azure/login identity must be allowed to manage the SQL server's firewall rules.
      - name: Apply EF migrations to Azure SQL
        uses: azure/sql-action@v2
        with:
          connection-string: ${{ secrets.PROD_SQL_CONNECTION }}
          path: ./migrate.sql

      # WEBSITE_RUN_FROM_PACKAGE=1 was tried on 2026-07-12 and is INERT on this Linux web
      # app (no package stored in /home/data/SitePackages; the site kept serving loose
      # wwwroot files) — the "=1" mode is effectively Windows/Functions-only. An ignored
      # setting is a landmine (a platform update could suddenly enforce it and break boot),
      # so remove it if present. No-op (and no restart) on every run after the first.
      - name: Remove inert WEBSITE_RUN_FROM_PACKAGE setting
        run: |
          RFP=$(az webapp config appsettings list \
            --name app-edvanz-api-prod --resource-group "$RG" \
            --query "[?name=='WEBSITE_RUN_FROM_PACKAGE'].value | [0]" -o tsv)
          if [ -n "$RFP" ]; then
            az webapp config appsettings delete \
              --name app-edvanz-api-prod --resource-group "$RG" \
              --setting-names WEBSITE_RUN_FROM_PACKAGE \
              --output none
            echo "Removed inert WEBSITE_RUN_FROM_PACKAGE (was '$RFP')."
          else
            echo "WEBSITE_RUN_FROM_PACKAGE not set — nothing to do."
          fi

      # Explicit zip deploy via OneDeploy: one artifact upload, server-side extraction,
      # single restart — measured a clean 63s swap with no throwaway container. Kept over
      # azure/webapps-deploy for determinism.
      - name: Package publish output
        run: cd publish && zip -qr ../package.zip .

      # ASYNC deploy + explicit verification. The synchronous CLI wait blocked the job
      # for a full 10 minutes whenever the first replacement container hit the
      # stale-app-settings boot crash (Azure-side; Azure auto-replaces the container)
      # and then reported a FALSE failure ("site failed to start within 10 mins") —
      # runs 29199123220 (marked failed, code actually shipped with the next run),
      # 29199655347 and 29204099544 (rescued by the old record-check fallback, ~13 min
      # each). Async returns as soon as the artifact is accepted; we then verify what
      # actually matters, with bounded budgets:
      #   1) the deployment record reaches status 4 (deployed) + active=true — Kudu
      #      finished extracting and registered the deployment (seconds, cap 2 min);
      #   2) /health/live (anonymous since this commit) returns 200 — the NEW process
      #      is serving (healthy path ~1-2 min, cap 5 min).
      # If (2) misses its budget while (1) holds, App Service is still cycling the
      # container through the known boot quirk: warn and exit 0 — the same trust level
      # the old fallback applied, but the job never sits blind for 10 minutes and a
      # red run once again means a REAL failure.
      - name: Deploy zip to App Service (async + verify)
        run: |
          az webapp deploy \
            --resource-group "$RG" --name app-edvanz-api-prod \
            --src-path package.zip --type zip --async true

          SUB=$(az account show --query id -o tsv)
          DEP_URL="https://management.azure.com/subscriptions/$SUB/resourceGroups/$RG/providers/Microsoft.Web/sites/app-edvanz-api-prod/deployments?api-version=2023-12-01"

          echo "Waiting for the deployment record to reach deployed+active (max 2 min)..."
          DEP_STATUS=""; DEP_ACTIVE=""
          for i in $(seq 1 24); do
            DEP_STATUS=$(az rest --method get --url "$DEP_URL" --query "value[0].properties.status" -o tsv)
            DEP_ACTIVE=$(az rest --method get --url "$DEP_URL" --query "value[0].properties.active" -o tsv | tr '[:upper:]' '[:lower:]')
            if [ "$DEP_STATUS" = "4" ] && [ "$DEP_ACTIVE" = "true" ]; then
              echo "Deployment record: deployed + active (~$((i*5))s)."
              break
            fi
            if [ "$DEP_STATUS" = "3" ]; then
              echo "Deployment record reports FAILED (status=3) — real failure."
              exit 1
            fi
            sleep 5
          done
          if [ "$DEP_STATUS" != "4" ] || [ "$DEP_ACTIVE" != "true" ]; then
            echo "Deployment record not deployed+active after 2 min (status=$DEP_STATUS active=$DEP_ACTIVE) — real failure."
            exit 1
          fi

          echo "Polling /health/live for the new process (max 5 min)..."
          for i in $(seq 1 30); do
            CODE=$(curl -s -o /dev/null -w "%{http_code}" --max-time 8 \
              https://app-edvanz-api-prod.azurewebsites.net/health/live || true)
            if [ "$CODE" = "200" ]; then
              echo "Site is serving the new build (healthy after ~$((i*10))s)."
              exit 0
            fi
            sleep 10
          done
          echo "::warning::Deployment is active but the site has not reported healthy within 5 min — App Service is still retrying the container (known stale-settings boot quirk). The swap completes on Azure's side; check /health/live in a few minutes."
          exit 0
