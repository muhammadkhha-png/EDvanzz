<style>
#erd { padding: 1rem 0; }
#erd svg.erDiagram .divider path { stroke-opacity: 0.5; }
#erd svg.erDiagram .row-rect-odd path,
#erd svg.erDiagram .row-rect-odd rect,
#erd svg.erDiagram .row-rect-even path,
#erd svg.erDiagram .row-rect-even rect { stroke: none !important; }
</style>
<div id="erd"></div>
<script type="module">
import mermaid from 'https://esm.sh/mermaid@11/dist/mermaid.esm.min.mjs';
const dark = matchMedia('(prefers-color-scheme: dark)').matches;
await document.fonts.ready;
mermaid.initialize({
  startOnLoad: false,
  theme: 'base',
  fontFamily: '"Anthropic Sans", sans-serif',
  themeVariables: {
    darkMode: dark,
    fontSize: '13px',
    fontFamily: '"Anthropic Sans", sans-serif',
    lineColor: dark ? '#9c9a92' : '#73726c',
    textColor: dark ? '#c2c0b6' : '#3d3d3a',
  },
});
const { svg } = await mermaid.render('erd-svg', `erDiagram
  Teachers ||--o{ AssignmentTemplates : owns
  Teachers ||--o{ TeacherStudents : owns
  Teachers ||--o{ Sessions : owns
  Teachers ||--o{ SessionGroups : owns

  AssignmentTemplates ||--o{ AssignmentScopes : "targets"
  AssignmentTemplates ||--o{ AssignmentOccurrences : generates
  AssignmentTemplates ||--o{ AssignmentDeletionLogs : audits

  AssignmentScopes }o--o| TeacherStudents : "individual"
  AssignmentScopes }o--o| Sessions : "session"
  AssignmentScopes }o--o| SessionGroups : "group"

  AssignmentOccurrences ||--o{ StudentAssignmentObligations : creates

  StudentAssignmentObligations }o--|| TeacherStudents : "for student"
  StudentAssignmentObligations ||--o{ StudentObligationAuditLogs : audits

  AssignmentTemplates {
    bigint Id PK
    bigint TeacherId FK
    tinyint AssignmentType "Exam-Homework"
    nvarchar Name
    nvarchar NameAr
    nvarchar Notes
    bool IsRecurring
    tinyint RecurrencePattern
    date RecurrenceEndDate
    tinyint TrackingMode "HW only"
    decimal MaxGrade "Exam only"
    decimal PassingThreshold "Exam only"
    bool IsRecurrenceStopped
    bigint CreatedByUserId FK
    datetime CreateAt
    datetime UpdatedAt
    rowversion RowVersion
  }

  AssignmentScopes {
    bigint Id PK
    bigint TemplateId FK
    bigint TeacherId FK
    tinyint ScopeType
    bigint TeacherStudentId FK
    bigint SessionId FK
    bigint SessionGroupId FK
    datetime CreateAt
  }

  AssignmentOccurrences {
    bigint Id PK
    bigint TemplateId FK
    bigint TeacherId FK
    int OccurrenceNumber
    date DueDate
    tinyint Status
    decimal MaxGradeSnapshot
    decimal PassingThresholdSnapshot
    tinyint TrackingModeSnapshot
    datetime CreateAt
    rowversion RowVersion
  }

  StudentAssignmentObligations {
    bigint Id PK
    bigint OccurrenceId FK
    bigint TeacherStudentId FK
    bigint TeacherId FK
    tinyint Status
    decimal GradeValue
    bool IsGradeEntered
    bool MarkedByScan
    datetime ScannedAt
    bigint LastUpdatedByUserId FK
    datetime CreateAt
    datetime UpdatedAt
    rowversion RowVersion
  }

  StudentObligationAuditLogs {
    bigint Id PK
    bigint StudentObligationId FK
    bigint TeacherId FK
    tinyint OldStatus
    tinyint NewStatus
    decimal OldGradeValue
    decimal NewGradeValue
    decimal MaxGradeSnapshot
    decimal PassingThresholdSnapshot
    nvarchar ChangeReason
    bigint ChangedByUserId FK
    datetime ChangedAt
  }

  AssignmentDeletionLogs {
    bigint Id PK
    bigint TemplateId
    bigint TeacherId FK
    bigint DeletedByUserId FK
    tinyint DeletionType "Hard-StopRecurrence"
    int StudentsAffected
    nvarchar TemplateNameSnapshot
    datetime DeletedAt
  }
`);
document.getElementById('erd').innerHTML = svg;

document.querySelectorAll('#erd svg.erDiagram .node').forEach(node => {
  const firstPath = node.querySelector('path[d]');
  if (!firstPath) return;
  const d = firstPath.getAttribute('d');
  const nums = d.match(/-?[\d.]+/g)?.map(Number);
  if (!nums || nums.length < 8) return;
  const xs = [nums[0], nums[2], nums[4], nums[6]];
  const ys = [nums[1], nums[3], nums[5], nums[7]];
  const x = Math.min(...xs), y = Math.min(...ys);
  const w = Math.max(...xs) - x, h = Math.max(...ys) - y;
  const rect = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
  rect.setAttribute('x', x); rect.setAttribute('y', y);
  rect.setAttribute('width', w); rect.setAttribute('height', h);
  rect.setAttribute('rx', '8');
  for (const a of ['fill', 'stroke', 'stroke-width', 'class', 'style']) {
    if (firstPath.hasAttribute(a)) rect.setAttribute(a, firstPath.getAttribute(a));
  }
  firstPath.replaceWith(rect);
});

document.querySelectorAll('#erd svg.erDiagram .row-rect-odd path, #erd svg.erDiagram .row-rect-even path').forEach(p => {
  p.setAttribute('stroke', 'none');
});
</script>
