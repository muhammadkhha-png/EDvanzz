# ─────────────────────────────────────────────────────────────────────────────
# Edvanz Admin (Angular 17) — Static Web Apps deployment
#
# Deploys UiAngular/edvanz-admin to Azure Static Web Apps on push to the default
# branch when the admin app (or this workflow) changes. Oryx runs `npm install`
# + `npm run build` inside app_location; the Angular application builder emits to
# dist/edvanz-admin/browser, which is what SWA serves.
#
# Prereq: repo secret AZURE_STATIC_WEB_APPS_API_TOKEN — created automatically when
# you provision the SWA and link this repo (or `az staticwebapp secrets list`).
# ─────────────────────────────────────────────────────────────────────────────
name: Deploy — Edvanz Admin (SWA)

on:
  push:
    branches: [ master_integration ]
    paths:
      - 'UiAngular/edvanz-admin/**'
      - '.github/workflows/deploy-admin.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build_and_deploy:
    name: Build and deploy admin SPA
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build and deploy to Static Web Apps
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: upload
          app_location: 'UiAngular/edvanz-admin'   # Angular project root (has package.json)
          output_location: 'dist/edvanz-admin/browser'  # application-builder output
          api_location: ''                          # no SWA-managed API; you use App Service
