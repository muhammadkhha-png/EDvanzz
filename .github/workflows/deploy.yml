on:
  push:
    branches: [ master_integration ]   # was: main
    paths-ignore:                      # doc-only changes don't need a prod redeploy
      - '**.md'

permissions: { id-token: write, contents: read }   # OIDC
jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: '10.0.x' }

      - run: dotnet restore
      - run: dotnet build -c Release --no-restore

      # ── EF migrations ────────────────────────────────────────────────────────
      # Generate an IDEMPOTENT migration script from the committed migrations and apply it to
      # Azure SQL BEFORE the new app version is swapped in. Migrations are NOT applied at app
      # startup (MigrateAsync was removed to avoid cold-start/multi-instance races), so this step
      # is the ONLY place the schema is updated. Previously this was an empty comment, which left
      # prod's schema frozen — do not remove it.
      - name: Install EF Core tools
        run: dotnet tool install --global dotnet-ef --version 10.0.9

      - name: Generate idempotent migration script
        run: |
          export PATH="$PATH:$HOME/.dotnet/tools"
          dotnet ef migrations script --idempotent \
            --project Edvanz.Infrastructure --startup-project Edvanz.API \
            -o migrate.sql
          echo "---- migrate.sql (head) ----"; head -n 40 migrate.sql

      # SELF-CONTAINED publish (bundles .NET 10 runtime — immune to platform rollout)
      - run: dotnet publish Edvanz.API -c Release -r linux-x64 --self-contained true -o ./publish

      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # Inject the DB connection string into Azure App Service configuration from the secret, so it
      # is NEVER committed to the repo (appsettings.Production.json intentionally has no "con").
      # Runs BEFORE deploy and fail-fast: if it errors, the job stops and the running app is left
      # untouched. Idempotent — sets the same app setting every deploy.
      - name: Set DB connection string in App Service config
        run: |
          RG=$(az webapp list --query "[?name=='app-edvanz-api-prod'].resourceGroup | [0]" -o tsv)
          if [ -z "$RG" ]; then echo "Could not resolve resource group for app-edvanz-api-prod"; exit 1; fi
          echo "Resource group: $RG"
          az webapp config appsettings set \
            --name app-edvanz-api-prod --resource-group "$RG" \
            --settings "ConnectionStrings__con=${{ secrets.PROD_SQL_CONNECTION }}" \
            --output none
          echo "App setting ConnectionStrings__con configured."

      # Apply the migration script to Azure SQL. azure/sql-action opens a temporary firewall rule
      # for the runner using the azure/login session above and removes it afterwards.
      # Requires repo secret PROD_SQL_CONNECTION (an ADO.NET connection string to the prod DB).
      # The azure/login identity must be allowed to manage the SQL server's firewall rules.
      - name: Apply EF migrations to Azure SQL
        uses: azure/sql-action@v2
        with:
          connection-string: ${{ secrets.PROD_SQL_CONNECTION }}
          path: ./migrate.sql

      - uses: azure/webapps-deploy@v3
        with:
          app-name: app-edvanz-api-prod
          package: ./publish
